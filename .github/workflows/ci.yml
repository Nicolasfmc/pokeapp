name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pokeapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pokeapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pokeapp?schema=public
      AUTH_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:migrate:deploy
      - run: npm run prisma:seed
      - run: npm test
        env:
          RUN_DB_TESTS: "1"
      - run: npm run lint
      - run: npm run build
